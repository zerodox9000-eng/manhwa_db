name: Daily Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

on:

  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

jobs:

  pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Bootstrap directories
        run: |
          mkdir -p db/raw/by-year
          mkdir -p db/processed/by-year
          mkdir -p db/processed/tags
          mkdir -p db/enriched/anilist
          mkdir -p db/snapshots/anilist-daily
          mkdir -p db/exports/frontend/details
          mkdir -p db/exports/frontend/meta
          mkdir -p db/exports/frontend/series
          mkdir -p db/exports/frontend/stats
          mkdir -p db/exports/frontend-v2/builds
          mkdir -p db/updates/changelog
          mkdir -p db/state  

      - name: Create .env
        run: |
          echo "MANGABAKA_API=${{ secrets.MANGABAKA_API }}" >> .env

      - name: Run Daily Pipeline
        run: npm run daily:incremental

      - name: Commit Updated DB
        run: |

          git config user.name "github-actions"

          git config user.email "actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "daily db update"

          git push
