name: Rebuild Frontend Exports

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: rebuild-frontend-exports
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Frontend Exports From Committed Data
        env:
          FRONTEND_WEEKLY_ONLY: "1"
        run: npm run build:frontend:cached

      - name: Validate Frontend Data Contract
        run: |
          npm run validate:frontend
          npm run validate:frontend:chunks
          npm run validate:github-sizes

      - name: Commit Updated Frontend Exports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add db/exports/frontend
          git diff --cached --quiet || git commit -m "rebuild frontend exports"
          git push
